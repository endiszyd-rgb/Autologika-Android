name: Build Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Restore Android signing key
        env:
          SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE" | base64 --decode > android/app/debug.keystore

      - name: Build universal release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare release files
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Autologika-Android-${VERSION}.apk"
          sha256sum "Autologika-Android-${VERSION}.apk" > "Autologika-Android-${VERSION}.apk.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: Autologika Android ${{ inputs.version }}
          body_path: .github/release-notes/${{ inputs.version }}.md
          make_latest: true
          files: |
            Autologika-Android-${{ inputs.version }}.apk
            Autologika-Android-${{ inputs.version }}.apk.sha256
